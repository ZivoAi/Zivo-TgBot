apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zivopal-classroom-bot.fullname" . }}-secrets
  labels:
    {{- include "zivopal-classroom-bot.labels" . | nindent 4 }}
type: Opaque
stringData:
  telegram-bot-token: {{ .Values.telegram.botToken | quote }}
  telegram-webhook-secret: {{ .Values.telegram.webhookSecret | quote }}
  zivopal-client-secret: {{ .Values.zivopal.clientSecret | quote }}
  {{- if .Values.llm.apiKey }}
  openai-api-key: {{ .Values.llm.apiKey | quote }}
  {{- end }}
  {{- if .Values.sentry.enabled }}
  sentry-dsn: {{ .Values.sentry.dsn | quote }}
  {{- end }}
