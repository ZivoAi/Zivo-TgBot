{{- /*
Template for generating Deployment with all environment variables
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zivopal-classroom-bot.fullname" . }}
  labels:
    {{- include "zivopal-classroom-bot.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "zivopal-classroom-bot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zivopal-classroom-bot.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "zivopal-classroom-bot.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.server.port }}
          protocol: TCP
        env:
        - name: NODE_ENV
          value: {{ .Values.server.nodeEnv | quote }}
        - name: PORT
          value: {{ .Values.server.port | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.logging.level | quote }}
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "zivopal-classroom-bot.fullname" . }}-secrets
              key: telegram-bot-token
        - name: TELEGRAM_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "zivopal-classroom-bot.fullname" . }}-secrets
              key: telegram-webhook-secret
        - name: TELEGRAM_WEBHOOK_URL
          value: {{ .Values.telegram.webhookUrl | quote }}
        - name: ZIVOPAL_API_URL
          value: {{ .Values.zivopal.apiUrl | quote }}
        - name: ZIVOPAL_CLIENT_ID
          value: {{ .Values.zivopal.clientId | quote }}
        - name: ZIVOPAL_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "zivopal-classroom-bot.fullname" . }}-secrets
              key: zivopal-client-secret
        - name: ZIVOPAL_SERVICE_NAME
          value: {{ .Values.zivopal.serviceName | quote }}
        - name: LLM_PROVIDER
          value: {{ .Values.llm.provider | quote }}
        - name: LLM_MODEL
          value: {{ .Values.llm.model | quote }}
        {{- if .Values.llm.apiKey }}
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "zivopal-classroom-bot.fullname" . }}-secrets
              key: openai-api-key
        {{- end }}
        - name: REDIS_ENABLED
          value: {{ .Values.redis.enabled | quote }}
        {{- if .Values.redis.enabled }}
        - name: REDIS_URL
          value: {{ .Values.redis.url | quote }}
        {{- end }}
        - name: RATE_LIMIT_ENABLED
          value: {{ .Values.rateLimit.enabled | quote }}
        - name: RATE_LIMIT_MAX
          value: {{ .Values.rateLimit.max | quote }}
        - name: RATE_LIMIT_WINDOW_MS
          value: {{ .Values.rateLimit.windowMs | quote }}
        - name: MODERATION_ENABLED
          value: {{ .Values.moderation.enabled | quote }}
        - name: MODERATION_CONFIDENCE_THRESHOLD
          value: {{ .Values.moderation.confidenceThreshold | quote }}
        - name: DEFAULT_LANGUAGE
          value: {{ .Values.i18n.defaultLanguage | quote }}
        - name: SUPPORTED_LANGUAGES
          value: {{ .Values.i18n.supportedLanguages | quote }}
        {{- if .Values.sentry.enabled }}
        - name: SENTRY_ENABLED
          value: "true"
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: {{ include "zivopal-classroom-bot.fullname" . }}-secrets
              key: sentry-dsn
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readiness
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 2
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
